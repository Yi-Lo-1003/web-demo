<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日常维护系统</title>
<style>
  :root {
    --ink: #2c3e50;
    --ink-dim: #7a8b9d;
    --line: #cfe0ef;
    --accent: #6ea8dc;
    --accent-strong: #4a8fd0;
    --paper: #ffffff;
    --paper-2: #f4f9fd;
    --page: #eaf3fb;
    --attention: #f0a05a;
    --calm: #5fae85;
    --danger: #d96c6c;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(120, 160, 200, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", -apple-system, sans-serif;
    background:
      linear-gradient(180deg, #d9e9f7 0%, #eaf3fb 40%, #f2f8fd 100%);
    min-height: 100vh;
    color: var(--ink);
    padding: 30px 20px 70px;
  }

  .wrap { max-width: 640px; margin: 0 auto; }

  /* 顶部 */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 26px;
    flex-wrap: wrap;
    gap: 14px;
  }
  .title-box h1 {
    font-size: 27px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--ink);
  }
  .title-box h1::before {
    content: "☁ ";
    color: var(--accent-strong);
  }
  .title-box .date {
    font-size: 13px;
    color: var(--ink-dim);
    margin-top: 4px;
  }
  .title-box .poem {
    font-size: 13px;
    color: #8aa7c4;
    margin-top: 8px;
    font-style: italic;
    letter-spacing: 0.5px;
    opacity: 0.85;
  }
  .btn {
    border: none;
    cursor: pointer;
    border-radius: 12px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    transition: all .18s ease;
  }
  .btn-primary {
    background: var(--accent-strong);
    color: #fff;
    box-shadow: 0 3px 10px rgba(74, 143, 208, 0.35);
  }
  .btn-primary:hover { background: #3f7fbd; transform: translateY(-1px); }
  .btn-ghost {
    background: #fff;
    color: var(--accent-strong);
    border: 1px solid var(--line);
  }
  .btn-ghost:hover { background: var(--paper-2); }

  /* 区块标题 */
  .section {
    background: var(--paper);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 18px;
    margin-bottom: 24px;
    border: 1px solid #e3eef8;
  }
  .section-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
    padding-bottom: 12px;
    border-bottom: 1.5px dashed var(--line);
  }
  .section-head .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(110, 168, 220, 0.18);
  }
  .section-head h2 { font-size: 17px; font-weight: 700; color: var(--ink); }
  .section-head .count {
    font-size: 12px;
    color: var(--accent-strong);
    background: var(--paper-2);
    padding: 2px 10px;
    border-radius: 20px;
    margin-left: auto;
  }

  /* 列表 */
  .list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    position: relative;
    border: 1px solid var(--line);
    transition: all .18s ease;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .card:hover {
    border-color: var(--accent);
    box-shadow: 0 3px 12px rgba(110, 168, 220, 0.22);
  }
  .card::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--line);
    flex-shrink: 0;
  }
  .card .icon {
    flex-shrink: 0;
    width: 42px; height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    background: var(--paper-2);
    border-radius: 12px;
    border: 1px solid var(--line);
  }
  .card.in-attention .icon { background: #fff2e4; border-color: #f3c08a; }
  .card.due .icon { background: #ffeaea; border-color: #f0a8a8; }
  .card::before { display: none; }
  .card.in-attention {
    background: #fff7ef;
    border-color: #f3c08a;
  }
  .card.in-attention::before { background: var(--attention); box-shadow: 0 0 0 4px rgba(240,160,90,0.18); }
  .card.due { background: #fff5f5; border-color: #f0a8a8; }
  .card.due::before { background: var(--danger); box-shadow: 0 0 0 4px rgba(217,108,108,0.18); }
  .card .main {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .card .name {
    font-size: 15px;
    font-weight: 600;
    word-break: break-word;
    color: var(--ink);
  }
  .card .right {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .card .meta {
    font-size: 12px;
    color: var(--ink-dim);
  }
  .badge {
    flex-shrink: 0;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 20px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge-attention { background: rgba(240, 160, 90, 0.16); color: #d9892e; }
  .badge-calm { background: rgba(95, 174, 133, 0.14); color: #4c9c73; }
  .card .days {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent-strong);
    white-space: nowrap;
  }
  .card .days span { font-size: 12px; font-weight: 500; color: var(--ink-dim); }
  .card .due-tag {
    font-size: 13px;
    font-weight: 700;
    color: var(--danger);
    white-space: nowrap;
  }
  .empty {
    color: var(--ink-dim);
    font-size: 14px;
    text-align: center;
    padding: 26px;
    background: var(--paper-2);
    border-radius: 10px;
    border: 1.5px dashed var(--line);
    margin-top: 14px;
  }

  /* 详情全屏页 */
  .detail-page {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, #d9e9f7 0%, #eaf3fb 40%, #f2f8fd 100%);
    z-index: 100;
    display: none;
    flex-direction: column;
    overflow-y: auto;
    padding: 20px 20px 40px;
  }
  .detail-page.show { display: flex; }
  .detail-inner { width: 100%; max-width: 640px; margin: 0 auto; flex: 1; }
  .detail-top {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 26px;
    flex-direction: column;
  }
  .btn-back {
    background: #fff;
    border: 1px solid var(--line);
    color: var(--accent-strong);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-back:hover { background: var(--paper-2); }
  .detail-title h3 {
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    margin-top: 12px;
  }
  .detail-title .sub {
    font-size: 14px;
    color: var(--ink-dim);
    margin-top: 6px;
  }
  .detail-content { display: flex; flex-direction: column; gap: 12px; }
  .detail-content .field {
    background: #fff;
    border: 1px solid #e3eef8;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 0;
    box-shadow: 0 2px 8px rgba(120, 160, 200, 0.12);
  }
  .detail-content .field label {
    display: block;
    font-size: 12px;
    color: var(--ink-dim);
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  .detail-content .field .value {
    font-size: 15px;
    line-height: 1.7;
    background: transparent;
    padding: 0;
    color: var(--ink);
  }
  .detail-content .field .value.desc { white-space: pre-wrap; }
  .detail-actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
    flex-wrap: wrap;
  }
  .detail-actions .btn { flex: 1; min-width: 110px; padding: 13px; }

  /* 详情弹窗（旧，保留类名避免残留） */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(60, 90, 120, 0.35);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 18px;
    width: 100%;
    max-width: 440px;
    padding: 26px;
    box-shadow: 0 16px 40px rgba(90, 130, 170, 0.28);
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h3 {
    font-size: 21px;
    margin-bottom: 4px;
    color: var(--ink);
  }
  .modal .sub {
    font-size: 13px;
    color: var(--ink-dim);
    margin-bottom: 20px;
  }
  .field { margin-bottom: 15px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--ink-dim);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  .field .value {
    font-size: 14px;
    line-height: 1.6;
    padding: 10px 14px;
    background: var(--paper-2);
    border-radius: 10px;
    word-break: break-word;
    color: var(--ink);
  }
  .field .value.desc { white-space: pre-wrap; }
  .modal .actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
    flex-wrap: wrap;
  }
  .modal .actions .btn { flex: 1; min-width: 90px; }
  .btn-done {
    background: var(--calm);
    color: #fff;
    box-shadow: 0 3px 10px rgba(95, 174, 133, 0.3);
  }
  .btn-done:hover { background: #4c9c73; }
  .btn-danger { background: #fdeeee; color: var(--danger); border: 1px solid #f2c2c2; }
  .btn-danger:hover { background: #fadfdf; }
  .btn-close {
    background: transparent;
    color: var(--ink-dim);
    border: none;
    font-size: 22px;
    cursor: pointer;
    position: absolute;
    top: 12px; right: 16px;
  }
  .modal-head { position: relative; }

  /* 表单弹窗 */
  .form input, .form textarea, .form select {
    width: 100%;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    font-size: 14px;
    outline: none;
  }
  .form input:focus, .form textarea:focus, .form select:focus {
    border-color: var(--accent-strong);
    box-shadow: 0 0 0 3px rgba(74, 143, 208, 0.12);
  }
  .form textarea { resize: vertical; min-height: 70px; }
  .form .row { display: flex; gap: 12px; }
  .form .row .field { flex: 1; }
  .toggle-seg {
    display: flex;
    gap: 8px;
  }
  .toggle-seg button {
    flex: 1;
    padding: 9px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-dim);
    cursor: pointer;
    font-size: 14px;
    transition: all .15s;
  }
  .toggle-seg button.active {
    background: var(--paper-2);
    border-color: var(--accent-strong);
    color: var(--accent-strong);
    font-weight: 600;
  }
  .hint { font-size: 12px; color: var(--ink-dim); margin-top: 4px; }
  .toast {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 14px;
    box-shadow: 0 6px 18px rgba(60, 80, 100, 0.3);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
    z-index: 200;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 520px) {
    .form .row { flex-direction: column; gap: 0; }
    .card .right { gap: 6px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-box">
      <h1>日常维护</h1>
      <div class="date" id="todayText"></div>
      <div class="poem" id="poemText"></div>
    </div>
    <button class="btn btn-primary" onclick="openForm(null)">+ 新增事务</button>
  </header>

  <div class="section">
    <div class="section-head">
      <span class="dot"></span>
      <h2>近期小事</h2>
      <span class="count" id="smallCount"></span>
    </div>
    <div class="list" id="smallGrid"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <span class="dot"></span>
      <h2>晚些时候</h2>
      <span class="count" id="cycleCount"></span>
    </div>
    <div class="list" id="cycleGrid"></div>
  </div>
</div>

<!-- 详情全屏页 -->
<div class="detail-page" id="detailPage">
  <div class="detail-top">
    <button class="btn-back" onclick="closeDetail()">‹ 返回</button>
    <div class="detail-title">
      <h3 id="dName"></h3>
      <div class="sub" id="dSub"></div>
    </div>
  </div>
  <div class="detail-content" id="detailBody"></div>
  <div class="detail-actions" id="detailActions"></div>
</div>

<!-- 表单弹窗 -->
<div class="overlay" id="formOverlay">
  <div class="modal form">
    <div class="modal-head">
      <h3 id="formTitle">新增事务</h3>
      <div class="sub">填写事务信息</div>
      <button class="btn-close" onclick="closeForm()">&times;</button>
    </div>
    <div class="field">
      <label>名称 *</label>
      <input id="fName" placeholder="例如：刷鞋" oninput="autoSuggestCycle()">
    </div>
    <div class="field">
      <label>周期天数 *</label>
      <input id="fCycle" type="number" min="1" placeholder="例如：30" oninput="markCycleManual()">
      <div class="hint" id="fCycleHint"></div>
    </div>
    <div class="field">
      <label>图标（可填一个 emoji，留空则自动匹配）</label>
      <input id="fIcon" placeholder="例如：👟">
    </div>
    <div class="field">
      <label>维护说明</label>
      <textarea id="fDesc" placeholder="例如：先用软毛刷去灰，再蘸清洁剂刷洗，阴干勿暴晒"></textarea>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="closeForm()">取消</button>
      <button class="btn btn-primary" onclick="saveForm()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 数据层 =====
const STORE_KEY = "daily_maintenance_items_v2";
let items = [];

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      items = JSON.parse(raw);
      // 旧版本数据兼容：若含有旧字段 type/status，则重建为最新结构
      if (items.length && items[0].hasOwnProperty("type")) {
        items = seedData();
      }
    } else {
      items = seedData();
    }
  } catch (e) {
    items = seedData();
  }
}
function save() {
  localStorage.setItem(STORE_KEY, JSON.stringify(items));
}

// 初始数据（基于权威生活建议）
function seedData() {
  const today = new Date();
  function d(offset) {
    const t = new Date(today.getTime() - offset * 86400000);
    return t.toISOString().slice(0, 10);
  }
  return [
    { id: uid(), name: "买洗衣液", type: "cycle", cycle: 30, desc: "", icon: "🧴", startDate: d(31), doneCount: 0 },
    { id: uid(), name: "买洗洁精", type: "cycle", cycle: 30, desc: "", icon: "🧴", startDate: d(28), doneCount: 0 },
    { id: uid(), name: "检查冰箱食材", type: "cycle", cycle: 7, desc: "", icon: "🧊", startDate: d(8), doneCount: 0 },
    { id: uid(), name: "刷鞋", type: "cycle", cycle: 30, desc: "", icon: "👟", startDate: d(18), doneCount: 0 },
    { id: uid(), name: "换牙刷", type: "cycle", cycle: 90, desc: "", icon: "🪥", startDate: d(60), doneCount: 0 },
    { id: uid(), name: "换毛巾", type: "cycle", cycle: 90, desc: "", icon: "🧺", startDate: d(45), doneCount: 0 },
    { id: uid(), name: "换床单", type: "cycle", cycle: 14, desc: "", icon: "🛏️", startDate: d(7), doneCount: 0 },
    { id: uid(), name: "清洗枕套", type: "cycle", cycle: 7, desc: "", icon: "🛌", startDate: d(3), doneCount: 0 },
    { id: uid(), name: "清理冰箱", type: "cycle", cycle: 60, desc: "", icon: "🧊", startDate: d(40), doneCount: 0 },
    { id: uid(), name: "清洗洗衣机", type: "cycle", cycle: 30, desc: "", icon: "🧺", startDate: d(15), doneCount: 0 },
    { id: uid(), name: "换抹布/海绵", type: "cycle", cycle: 14, desc: "", icon: "🧽", startDate: d(10), doneCount: 0 }
  ];
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// 计算剩余天数（按自然日自动减）
function remainingDays(item) {
  if (!item.cycle) return null;
  const start = new Date(item.startDate + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const elapsed = Math.floor((today - start) / 86400000);
  return item.cycle - elapsed;
}

// ===== 渲染 =====
function todayStr() {
  const now = new Date();
  const wd = ["日","一","二","三","四","五","六"][now.getDay()];
  return `${now.getFullYear()} 年 ${now.getMonth()+1} 月 ${now.getDate()} 日 · 星期${wd}`;
}

// 清新诗句库（每天按日期轮换一句）
const POEMS = [
  "采菊东篱下，悠然见南山。",
  "空山新雨后，天气晚来秋。",
  "明月松间照，清泉石上流。",
  "人闲桂花落，夜静春山空。",
  "小荷才露尖尖角，早有蜻蜓立上头。",
  "接天莲叶无穷碧，映日荷花别样红。",
  "竹外桃花三两枝，春江水暖鸭先知。",
  "天街小雨润如酥，草色遥看近却无。",
  "等闲识得东风面，万紫千红总是春。",
  "停车坐爱枫林晚，霜叶红于二月花。",
  "忽如一夜春风来，千树万树梨花开。",
  "春风又绿江南岸，明月何时照我还。",
  "绿树村边合，青山郭外斜。",
  "树阴照水爱晴柔，早有蜻蜓立上头。",
  "稻花香里说丰年，听取蛙声一片。",
  "梅子金黄杏子肥，麦花雪白菜花稀。",
  "沾衣欲湿杏花雨，吹面不寒杨柳风。",
  "草长莺飞二月天，拂堤杨柳醉春烟。",
  "几处早莺争暖树，谁家新燕啄春泥。",
  "留连戏蝶时时舞，自在娇莺恰恰啼。",
  "日出江花红胜火，春来江水绿如蓝。",
  "烟笼寒水月笼沙，夜泊秦淮近酒家。",
  "孤帆远影碧空尽，唯见长江天际流。",
  "两岸青山相对出，孤帆一片日边来。",
  "潮平两岸阔，风正一帆悬。",
  "晴空一鹤排云上，便引诗情到碧霄。",
  "何须浅碧深红色，自是花中第一流。",
  "水晶帘动微风起，满架蔷薇一院香。",
  "云淡风轻近午天，傍花随柳过前川。",
  "山中何事？松花酿酒，春水煎茶。"
];

function todayPoem() {
  const now = new Date();
  const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
  return POEMS[dayOfYear % POEMS.length];
}

function render() {
  document.getElementById("todayText").textContent = todayStr();
  document.getElementById("poemText").textContent = todayPoem();
  // 剩余 ≤ 2 天 → 近期小事（该做）；> 2 天 → 晚些时候（倒计时中）
  const small = items.filter(i => { const r = remainingDays(i); return r !== null && r <= 2; });
  const cycle = items.filter(i => { const r = remainingDays(i); return r !== null && r > 2; });

  // 近期小事（到期该做）
  const sg = document.getElementById("smallGrid");
  document.getElementById("smallCount").textContent = `${small.length} 件`;
  sg.innerHTML = small.length ? small.map(cardSmall).join("") : `<div class="empty">暂无到期事务，一切安稳 ✨</div>`;

  // 晚些时候（倒计时中）
  const cg = document.getElementById("cycleGrid");
  document.getElementById("cycleCount").textContent = `${cycle.length} 件`;
  cg.innerHTML = cycle.length ? cycle.map(cardCycle).join("") : `<div class="empty">暂无倒计时中的事务，点右上角「新增事务」添加</div>`;
}

// 按名称关键词匹配趣味图标
function pickIcon(name) {
  const n = String(name || "");
  const map = [
    ["鞋", "👟"], ["牙刷", "🪥"], ["毛巾", "🧺"], ["床单", "🛏️"], ["枕", "🛌"],
    ["冰箱", "🧊"], ["洗衣", "🧺"], ["抹布", "🧽"], ["海绵", "🧽"], ["拖把", "🧹"],
    ["扫", "🧹"], ["洗碗", "🍽️"], ["锅", "🍳"], ["厨房", "🍳"], ["买菜", "🛒"],
    ["买", "🛒"], ["洗洁精", "🧴"], ["洗衣液", "🧴"], ["垃圾", "🗑️"], ["宠物", "🐾"],
    ["猫", "🐱"], ["狗", "🐶"], ["花", "🌷"], ["植物", "🪴"], ["浇", "💧"],
    ["换", "🔄"], ["检查", "🔍"], ["清理", "✨"], ["刷", "🪥"], ["擦", "🧽"]
  ];
  for (const [k, e] of map) {
    if (n.includes(k)) return e;
  }
  return "📌";
}

// 按名称关键词匹配建议维护周期（天数）
function suggestCycle(name) {
  const n = String(name || "");
  const map = [
    ["牙刷", 90], ["毛巾", 90], ["浴巾", 90], ["床单", 14], ["被套", 14], ["枕套", 7], ["枕芯", 180],
    ["刷鞋", 30], ["鞋", 30], ["抹布", 14], ["海绵", 14], ["洗碗", 30], ["筷子", 90], ["砧板", 180],
    ["冰箱", 60], ["洗衣机", 30], ["油烟机", 90], ["空调滤网", 14], ["空调", 30], ["热水器", 180],
    ["马桶", 15], ["窗帘", 180], ["地毯", 90], ["沙发", 30], ["键盘", 7], ["垃圾桶", 7],
    ["饮水机", 60], ["微波炉", 30], ["浴球", 30], ["剃须刀", 14], ["枕头", 365]
  ];
  for (const [k, d] of map) {
    if (n.includes(k)) return d;
  }
  return null;
}

function cardSmall(item) {
  const icon = item.icon || pickIcon(item.name);
  return `
    <div class="card in-attention due" onclick="openDetail('${item.id}')">
      <span class="icon">${icon}</span>
      <div class="main">
        <div class="name">${esc(item.name)}</div>
        <div class="right"><span class="due-tag">该做了</span></div>
      </div>
    </div>`;
}

function cardCycle(item) {
  const rem = remainingDays(item);
  const due = rem !== null && rem <= 0;
  const icon = item.icon || pickIcon(item.name);
  const daysHtml = `<span class="days">${rem}<span> 天后</span></span>`;
  return `
    <div class="card ${due ? "due" : ""}" onclick="openDetail('${item.id}')">
      <span class="icon">${icon}</span>
      <div class="main">
        <div class="name">${esc(item.name)}</div>
        <div class="right">${daysHtml}</div>
      </div>
    </div>`;
}

function esc(s) {
  return String(s || "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}

// ===== 详情 =====
let currentId = null;
function openDetail(id) {
  currentId = id;
  const item = items.find(i => i.id === id);
  if (!item) return;
  document.getElementById("dName").textContent = item.name;
  const rem = remainingDays(item);
  let sub = `周期维护 · 每 ${item.cycle} 天`;
  sub += rem !== null && rem <= 0 ? " · 已到期" : (rem !== null ? ` · 剩 ${rem} 天` : "");
  document.getElementById("dSub").textContent = sub;

  const rows = [];
  const sug = suggestCycle(item.name);
  let v = `${item.cycle} 天`;
  if (sug && sug !== item.cycle) v += `（建议 ${sug} 天）`;
  rows.push(field("维护周期", v));
  rows.push(field("维护说明", item.desc || "（未填写）", "desc"));
  rows.push(field("开始日期", item.startDate || "—"));
  rows.push(field("已维护次数", `${item.doneCount} 次`));
  const st = rem !== null ? (rem <= 2 ? (rem <= 0 ? "已到期 · 该做了" : "临近到期 · 该做了") : `安稳 · 剩 ${rem} 天`) : "—";
  rows.push(field("当前状态", st));
  document.getElementById("detailBody").innerHTML = rows.join("");

  // 操作按钮
  const acts = document.getElementById("detailActions");
  let html = `<button class="btn btn-done" onclick="markDone('${id}')">完成 · 重置周期</button>`;
  html += `<button class="btn btn-ghost" onclick="openForm('${id}')">编辑</button>`;
  html += `<button class="btn btn-danger" onclick="delItem('${id}')">删除</button>`;
  acts.innerHTML = html;

  document.getElementById("detailPage").classList.add("show");
}

function field(label, value, cls) {
  return `<div class="field"><label>${label}</label><div class="value ${cls || ""}">${esc(value)}</div></div>`;
}

function closeDetail() {
  document.getElementById("detailPage").classList.remove("show");
}

function markDone(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  item.doneCount += 1;
  item.startDate = todayISO();
  save();
  closeDetail();
  render();
  toast("已完成 ✓ 已重置周期");
}

function delItem(id) {
  if (!confirm("确定删除这条事务吗？")) return;
  items = items.filter(i => i.id !== id);
  save();
  closeDetail();
  render();
  toast("已删除");
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

// ===== 表单 =====
let editingId = null;

function openForm(id) {
  editingId = id;
  cycleManual = false;
  const item = id ? items.find(i => i.id === id) : null;
  document.getElementById("formTitle").textContent = item ? "编辑事务" : "新增事务";
  document.getElementById("fName").value = item ? item.name : "";
  document.getElementById("fDesc").value = item ? (item.desc || "") : "";
  document.getElementById("fCycle").value = item && item.cycle ? item.cycle : "";
  document.getElementById("fIcon").value = item && item.icon ? item.icon : "";
  document.getElementById("fCycleHint").textContent = "";
  autoSuggestCycle();
  document.getElementById("formOverlay").classList.add("show");
}

// 记录用户是否手动改过周期（避免自动建议覆盖）
let cycleManual = false;
function markCycleManual() { cycleManual = true; }

// 名称变化时自动预填建议周期
function autoSuggestCycle() {
  const name = document.getElementById("fName").value.trim();
  const s = suggestCycle(name);
  const input = document.getElementById("fCycle");
  const hint = document.getElementById("fCycleHint");
  if (s && !cycleManual) {
    input.value = s;
    hint.textContent = `💡 已根据「${name}」填入建议周期 ${s} 天，可自行修改`;
  } else if (s) {
    hint.textContent = `💡 建议周期约 ${s} 天（已手动修改）`;
  } else {
    hint.textContent = "";
  }
}

function closeForm() {
  document.getElementById("formOverlay").classList.remove("show");
}

function saveForm() {
  const name = document.getElementById("fName").value.trim();
  if (!name) { toast("请填写名称"); return; }
  const cycle = parseInt(document.getElementById("fCycle").value, 10);
  if (!cycle || cycle < 1) { toast("请填写有效的周期天数"); return; }
  const desc = document.getElementById("fDesc").value.trim();
  const icon = document.getElementById("fIcon").value.trim();

  if (editingId) {
    const item = items.find(i => i.id === editingId);
    if (item) {
      item.name = name;
      item.cycle = cycle;
      item.desc = desc;
      item.icon = icon;
    }
    toast("已保存修改");
  } else {
    items.push({
      id: uid(), name, cycle, desc, icon,
      startDate: todayISO(), doneCount: 0
    });
    toast("已添加");
  }
  save();
  closeForm();
  render();
}

// ===== 弹窗关闭（点遮罩） =====
document.getElementById("formOverlay").addEventListener("click", e => { if (e.target.id === "formOverlay") closeForm(); });

// ===== toast =====
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

// ===== 启动 =====
load();
render();
</script>
</body>
</html>
